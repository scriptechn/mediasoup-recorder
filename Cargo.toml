[workspace]
members = ["crates/recorder"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Saif", "Qusai Mo"]
repository = "https://github.com/scriptechn/mediasoup-recorder"
publish = false

# Meeting recorder for SFU egress: capture role (during the meeting) and compose role (after it).
# Architecture and contracts: docs/. Toolchain pinned by rust-toolchain.toml.
[workspace.dependencies]
# GStreamer (official bindings).
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-controller = "0.24"
glib = "0.21"
# Slates and labels are drawn in Rust: no text plugin in the runtime image.
ab_glyph = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

# Control socket: the controller connects with socket.io-client v4 (docs/protocol.md); socketioxide speaks
# protocol v5 / EIO=4.
socketioxide = { version = "0.18", features = ["state", "extensions", "tracing"] }
axum = "0.8"
url = "2"
# Optional registry, load and status (docs/protocol.md): a Redis the controllers and the application share.
redis = { version = "1", features = ["tokio-comp"] }
futures-util = "0.3"
libc = "0.2"
# Optional upload to any S3-compatible store: multipart, bounded retries inside the client.
object_store = { version = "0.14", features = ["aws"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
